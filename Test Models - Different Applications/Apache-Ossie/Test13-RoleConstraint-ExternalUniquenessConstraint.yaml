version: 0.2.0.dev0
name: Test13-RoleConstraint-ExternalUniquenessConstraint
ontology:
- concept: Name
  type: ValueType
  extends:
  - String
- concept: Person_Id
  type: ValueType
  extends:
  - Float
- concept: Person
  type: EntityType
  identify_by:
  - PersonHasPersonId
  relationships:
  - name: PersonHasPersonId
    roles:
    - concept: Person_Id
    verbalizes:
    - '{Person} has {Person_Id}'
    - '{Person_Id} is of {Person}'
    multiplicity: OneToOne
  - name: PersonHasFirstName
    roles:
    - concept: Name
    verbalizes:
    - '{Person} has first-{Name}'
    multiplicity: ManyToOne
  - name: PersonHasLastName
    roles:
    - concept: Name
    verbalizes:
    - '{Person} has last-{Name}'
    multiplicity: ManyToOne
