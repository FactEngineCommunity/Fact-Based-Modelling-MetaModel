version: 0.2.0.dev0
name: Test22-ObjectifiedFactTypeWithAdjoinedFactType
ontology:
- concept: Company_Id
  type: ValueType
  extends:
  - Integer
- concept: DateType
  type: ValueType
  extends:
  - Date
- concept: Supplier_Id
  type: ValueType
  extends:
  - Integer
- concept: Company
  type: EntityType
  identify_by:
  - CompanyHasCompany_Id
  relationships:
  - name: CompanyHasSupplier
    roles:
    - concept: Supplier
    verbalizes:
    - '{Company} has {Supplier}'
    - '{Supplier} is for {Company}'
  - name: CompanyHasCompany_Id
    roles:
    - concept: Company_Id
    verbalizes:
    - '{Company} has {Company_Id}'
    - '{Company_Id} is of {Company}'
    multiplicity: OneToOne
- concept: CompanyHasSupplier
  type: EntityType
  relationships:
  - name: CompanyHasSupplierFromDate
    roles:
    - concept: DateType
    verbalizes:
    - '{CompanyHasSupplier} from {DateType}'
    multiplicity: ManyToOne
  - name: CompanyCompanySupplier
    roles:
    - concept: Company
    verbalizes:
    - '{CompanyHasSupplier} involves {Company}'
    - '{Company} is involved in {CompanyHasSupplier}'
    multiplicity: ManyToOne
  - name: SupplierCompanySupplier
    roles:
    - concept: Supplier
    verbalizes:
    - '{CompanyHasSupplier} involves {Supplier}'
    - '{Supplier} is involved in {CompanyHasSupplier}'
    multiplicity: ManyToOne
- concept: Supplier
  type: EntityType
  identify_by:
  - SupplierHasSupplier_Id
  relationships:
  - name: SupplierHasSupplier_Id
    roles:
    - concept: Supplier_Id
    verbalizes:
    - '{Supplier} has {Supplier_Id}'
    - '{Supplier_Id} is of {Supplier}'
    multiplicity: OneToOne
